name: PGPlan Insight release gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Locked install
        run: npm ci
      - name: Install supported browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run release gate
        run: npm run release:gate
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence-${{ matrix.os }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
