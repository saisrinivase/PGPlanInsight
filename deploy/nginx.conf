# Include inside your HTTPS server block; root must point only to built dist.
root /srv/pgplan/dist;
index index.html;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
location / { try_files $uri $uri/ /index.html; }
# Release evidence belongs in CI, not the public web root.
location /release/ { deny all; }
